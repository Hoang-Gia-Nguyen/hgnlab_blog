<script>
(function() {
  'use strict';

  // ─── Reading Progress Bar ───────────────────────────────────────────
  if (document.querySelector('article')) {
    var bar = document.createElement('div');
    bar.id = 'reading-progress';
    bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;background:var(--color-accent,#ec4899);z-index:9999;width:0;transition:width 100ms linear;';
    document.body.appendChild(bar);
    var setProgress = function() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', setProgress, { passive: true });
    window.addEventListener('resize', setProgress, { passive: true });
    setProgress();
  }

  // ─── Code Copy Button ───────────────────────────────────────────────
  document.querySelectorAll('pre > code').forEach(function(codeBlock) {
    var pre = codeBlock.parentElement;
    if (pre.querySelector('.copy-btn')) return;
    var wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:relative;';
    pre.parentElement.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.style.cssText = 'position:absolute;top:0.5rem;right:0.5rem;z-index:10;padding:0.25rem 0.75rem;font-size:0.75rem;font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;border-radius:0.375rem;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);cursor:pointer;transition:all 0.15s ease;backdrop-filter:blur(4px);';
    btn.addEventListener('mouseenter', function(){ this.style.background = 'rgba(255,255,255,0.2)'; this.style.color = '#fff'; });
    btn.addEventListener('mouseleave', function(){ this.style.background = 'rgba(255,255,255,0.1)'; this.style.color = 'rgba(255,255,255,0.8)'; });
    btn.addEventListener('click', function() {
      var text = codeBlock.textContent;
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = 'Copied!';
        setTimeout(function(){ btn.textContent = 'Copy'; }, 2000);
      }).catch(function() {
        btn.textContent = 'Failed';
        setTimeout(function(){ btn.textContent = 'Copy'; }, 2000);
      });
    });
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });

  // ─── Image Lightbox ─────────────────────────────────────────────────
  (function() {
    var overlay = document.createElement('div');
    overlay.id = 'img-lightbox';
    overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.85);cursor:zoom-out;justify-content:center;align-items:center;padding:2rem;';
    var img = document.createElement('img');
    img.style.cssText = 'max-width:90vw;max-height:90vh;object-fit:contain;border-radius:0.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);';
    overlay.appendChild(img);
    overlay.addEventListener('click', function(){ overlay.style.display = 'none'; });
    document.body.appendChild(overlay);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && overlay.style.display !== 'none') overlay.style.display = 'none';
    });
    document.querySelectorAll('article img').forEach(function(articleImg) {
      articleImg.style.cursor = 'zoom-in';
      articleImg.addEventListener('click', function() {
        img.src = this.src;
        img.alt = this.alt || '';
        overlay.style.display = 'flex';
      });
    });
  })();

})();
</script>
