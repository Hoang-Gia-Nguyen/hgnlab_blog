<style>
  :root {
    --color-border: #e4e4e7;
    --color-foreground: #09090b;
    --color-accent: #ec4899;
    --color-muted: #f4f4f5;
    --color-surface: #ffffff;
    --color-border-dim: #f0f0f3;
    scroll-behavior: smooth;
  }
  .dark {
    --color-border: #27272a;
    --color-foreground: #fafafa;
    --color-accent: #f472b6;
    --color-muted: #27272a;
    --color-surface: #1c1c1e;
    --color-border-dim: #2c2c2e;
  }

  body {
    font-family: 'Noto Sans', ui-sans-serif, system-ui, sans-serif;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Be Vietnam Pro', 'Noto Sans', ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
  }

  /* ── Post card styles ── */
  .page-card {
    border-bottom: 1px solid var(--color-border);
  }
  .page-card:last-of-type {
    border-bottom: none;
  }

  .page-card-title {
    color: var(--color-foreground);
    transition: color 0.2s ease;
  }
  .page-card:hover .page-card-title {
    color: var(--color-accent);
  }

  /* ── Sticky Table of Contents ── */
  @media (min-width: 1024px) {
    article .block-bg:has(details) {
      position: -webkit-sticky;
      position: sticky;
      top: 5rem;
      z-index: 10;
    }
  }

  /* ── Language switcher text label ── */
  .btn-translations {
    font-size: 0 !important;
    background-image: none !important;
    width: auto !important;
    height: auto !important;
    display: inline-flex !important;
    align-items: center !important;
  }
  .btn-translations::after {
    content: attr(data-label);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.1rem 0.5rem;
    border-radius: 0.25rem;
    background: var(--color-accent);
    color: #fff;
    line-height: 1.4;
  }

  /* ── Mobile post card padding ── */
  @media (max-width: 639px) {
    .page-card {
      padding-top: 1.25rem !important;
      padding-bottom: 1.25rem !important;
    }
  }

  /* ── Mobile donation CTA slim banner ── */
  @media (max-width: 639px) {
    .donation-card {
      padding: 0.75rem 1rem !important;
      border-width: 1px !important;
    }
    .donation-card h2 {
      font-size: 1rem !important;
      padding-bottom: 0.25rem !important;
    }
    .donation-text {
      display: none;
    }
    .donation-button {
      margin-top: 0.25rem !important;
      padding: 0.3rem 1rem !important;
      font-size: 0.875rem !important;
    }
  }
</style>

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}
